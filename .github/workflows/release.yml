name: Release

# Run from Actions → Release → Run workflow (or `gh workflow run release.yml`).
# Without "Publish release" it is a test build whose installers are kept as
# workflow artifacts. With it, it builds every platform into a draft GitHub
# release `v<package.json version>`; publishing that draft creates the tag and
# makes the update visible to installed copies.

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target to build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows-x64
          - macos-arm64
      publish_release:
        description: 'Publish release (draft for the package.json version)'
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tag: ${{ steps.release.outputs.tag }}
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - id: set-matrix
        env:
          INPUT: ${{ inputs.build_target }}
        run: |
          # Intel macOS (x86_64-apple-darwin, runner `macos-15-intel`) is
          # intentionally NOT built: the `clip` sidecar needs onnxruntime, which
          # has no macOS x86_64 wheel on PyPI (only macosx_14_0_arm64, for every
          # release up to 1.31.0), so its PyInstaller build cannot run there.
          # To add it back, first move CLIP off Python (e.g. the `ort` crate) or
          # drop CLIP on Intel, then add the matrix entry:
          #   {"name":"macos-x64","os":"macos-15-intel"}
          ALL='[{"name":"windows-x64","os":"windows-latest"},{"name":"macos-arm64","os":"macos-latest"}]'

          if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
            SEL="$ALL"
          else
            SEL=$(echo "$ALL" | jq -c --arg n "$INPUT" '[.[] | select(.name == $n)]')
          fi

          echo "matrix=$(echo "$SEL" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: ${{ inputs.publish_release }}
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      # The draft is created once here: parallel platform builds racing to
      # create it would end up with duplicate drafts.
      - id: release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG="v$(jq -r .version package.json)"

          if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::$TAG is already released. Bump the version in package.json first."
            exit 1
          fi

          # Reuse the draft of a failed attempt, pointing it at this commit.
          ID=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/releases/$ID" -f target_commitish="$GITHUB_SHA" --silent
          else
            ID=$(gh api "repos/$REPO/releases" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" \
              -f name="Photokin $TAG" -F draft=true --jq .id)
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "id=$ID" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # The sidecar requirements are pinned for cp311 wheels.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/*/requirements.txt

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sidecars (ffmpeg download + PyInstaller builds) are skipped by the
      # prebuild scripts when the binary already exists, so caching this folder
      # avoids rebuilding them on every run. Bumps whenever their sources change.
      - uses: actions/cache@v4
        with:
          path: src-tauri/resources
          key: sidecars-${{ matrix.name }}-${{ hashFiles('scripts/*.mjs', 'scripts/lib/*.mjs', 'scripts/clip/clip.py', 'scripts/clip/requirements.txt', 'scripts/face_recognition/face_recognition.py', 'scripts/face_recognition/requirements.txt') }}

      # ONNX models downloaded by the face_recognition setup script, so a
      # sidecar rebuild doesn't re-download them.
      - uses: actions/cache@v4
        with:
          path: scripts/face_recognition/models
          key: face-models-${{ hashFiles('scripts/setup_face_recognition_sidecar.mjs') }}

      - run: pnpm install --frozen-lockfile

      # `pnpm tauri build` runs `pnpm build`, whose `prebuild` hook downloads
      # ffmpeg and builds the PyInstaller sidecars for this runner's platform.
      # The Tauri CLI version is pinned by pnpm-lock.yaml.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts and `latest.json` the in-app updater
          # verifies. Losing this key means installed copies can't auto-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Empty on test builds, so nothing is uploaded to a release.
          releaseId: ${{ needs.setup.outputs.release_id }}
          tagName: ${{ needs.setup.outputs.tag }}

      # Test builds don't create a release, so keep the installers as artifacts.
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.publish_release }}
        with:
          name: photokin-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
